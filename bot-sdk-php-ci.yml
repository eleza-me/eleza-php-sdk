name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check syntax
        run: find src tests examples autoload.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: composer test

      - name: Load without Composer
        run: php -r 'require "autoload.php"; new Eleza\Bot\Bot("ezb1.ci"); echo Eleza\Bot\Client::VERSION, PHP_EOL;'
